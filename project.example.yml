# Copy to project.yml (or docs/agents/project.yml in each app repo) and fill in.
# Public packs read this for board ids, branch names, commands, and ship-mode hosts.
# Keep the real file in a private overlay (see README "Project config").

version: 1
org: <github-org>
founder: <founder-name>          # irreversible merges / promotes

roles:
  cos: Chief of Staff            # parent gate for irreversible steps
  board: Board                   # triage / intake role
  dispatch: Dispatch             # merge-path role
  device_qa: Mobile QA           # phone Device QA bot lane (DELEGATION, device-qa-verifier)

limits:
  max_children: 8      # one child cap for both runtimes (Cursor runs 8 agents in parallel); unset → 8
  child_mem_gb: 3      # Claude Code in-process child needs this much free memory; unset → 3
  mem_reserve_gb: 2    # kept free for the parent; unset → 2. See DELEGATION "Child shape by runtime"
  heavy_gate_slots: 3  # max heavy checks at once per container; a new one starts only if 2 GB fits after the reserve at that moment; unset → 3

device_qa:
  # desk_emulator: emulator-5554  # optional; a Desk crawl may run on this emulator serial (Field / iPhone stay manual). Unset → USB phone only

branches:
  dev: Development               # or main
  held: [master, Preview]        # promote only on founder say-so

commands:
  pr_ready: "pnpm run check:pr-ready"       # Mode B gate; paste PASS line in PR body
  pr_ready_pass: "check:pr-ready PASS"      # literal PASS line Dispatch looks for (names the dev tip)
  db_migrate: "cd backend && npm run db:migrate:all"  # when a new migration file is added; carries its own cd
  preflight_master: "npm run preflight:master"        # master bar (runs cycles; verify does not)
  preflight_cycles: "npm run preflight:governance:cycles"
  effect_schema_inventory: "npm run check:effect-schema-inventory"
  cycles_backend: "cd backend && npm run check-cycles"
  cycles_mobile: "cd <mobile-pkg> && npm run check-cycles"
  governance: "npm run check:governance"
  # graph_freshness: "node scripts/graph-freshness.mjs"  # optional; exit 0 = local code graph fresh (built at HEAD, ahead, or <24h behind). Unset → skip graphify Orient

paths:
  mobile_src: <mobile-pkg>/src
  mobile_services: <mobile-pkg>/src/services
  backend_src: backend/src
  drizzle_glob: backend/drizzle/0xxx_*.sql
  device_qa_checklist: docs/operations/DEVICE_QA_PHASED_CHECKLIST.md
  # desk_avd_runbook: docs/operations/<desk-emulator-runbook>.md  # optional; boot / kill steps for device_qa.desk_emulator
  effect_schema_inventory: docs/engineering/EFFECT_SCHEMA_TRUST_BOUNDARIES.md
  umbrella_cursor: docs/agents/UMBRELLA_CURSOR.md
  agent_rules: AGENTS.md            # repo agent-rules / coding standing file; read at start, named in every child packet (unset → AGENTS.md)
  wayfinder_now: docs/trackers/WAYFINDER_NOW.md
  wayfinder_maps: docs/trackers/WAYFINDER_MAPS.md
  house_boards: []                  # house encyclopedia docs living-docs grep should include
  map_build: <docs-or-website-repo>/map-build/

ship_mode:
  local_hosts: [<local-dev-host>]   # USB / desk machine name(s)
  local_mode: Development           # Ship mode pin on those hosts
  cloud_mode: PR                    # Grok Bot / Cursor cloud

product:
  end_user: user                    # e.g. runner, customer
  apply_end_user_stories_in: []     # repo names where grill Context uses end_user language
  standing_rules_doc: docs/agents/standing-product-rules.md  # optional private locks

repos:
  - name: <primary-repo>
    kind: primary
    project_number: 1
    project_url: https://github.com/users/<github-org>/projects/1
    project_node: PVT_...
    status_field: PVTSSF_...
    live_beta_milestone: <n>
    go_live_milestone: <n>
    status_options:
      Unclaimed: <id>
      In Progress: <id>
      Done: <id>
      Ready to merge: <id>
      Live Beta: <id>
      GoLive: <id>
      Parked: <id>
      Operator: <id>
      Desk device: <id>
      Field: <id>
  # Add satellite repos (website, watch, …) the same way. One board per repo.

workspace:
  overlay_pack: <private-overlay-repo-name>   # sibling clone; sync layers it on top
  skill_targets:
    - { name: <primary-repo>, dirs: [.cursor/skills] }   # add .grok/skills / .claude/skills when your coding agent loads those first
